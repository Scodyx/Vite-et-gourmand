<section class="form-page"><form class="form-card" [formGroup]="form" (ngSubmit)="send()"><p class="eyebrow">Échangeons</p><h1>Contact</h1><label>Titre<input formControlName="title"></label><label>Adresse e-mail<input type="email" formControlName="email"></label><label>Votre message<textarea formControlName="message" rows="7"></textarea></label><button class="button" [disabled]="form.invalid||loading()">Envoyer</button>@if(message()){<p class="alert" role="status">{{message()}}</p>}</form></section>
