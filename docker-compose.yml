services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vite_et_gourmand}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vite_et_gourmand}"]
      interval: 5s
      timeout: 5s
      retries: 10
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-vite_et_gourmand_statistics}
    ports: ["${MONGODB_PORT:-27017}:27017"]
    volumes: [mongodb_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["${MAIL_PORT:-1025}:1025", "${MAIL_UI_PORT:-8025}:8025"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
volumes:
  postgres_data:
  mongodb_data:
