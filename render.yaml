services:
  - type: web
    name: vite-gourmand-api
    runtime: docker
    plan: free
    branch: develop
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/public/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: INITIAL_ADMIN_ENABLED
        value: "false"
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

  - type: web
    name: vite-gourmand
    runtime: static
    branch: develop
    rootDir: frontend
    buildCommand: npm ci && npm run build:render
    staticPublishPath: ./dist/frontend/browser
    envVars:
      - key: API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
